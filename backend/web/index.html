<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureAccess Pro - Zero Trust Network Access</title>
<style>
  :root{
    --navy:#2c3e50; --navy2:#34495e; --headbar:#2c3e50; --light:#ecf0f1; --white:#fff;
    --green:#27ae60; --greenh:#219150; --blue:#3498db; --blueh:#2b83bf; --red:#e74c3c;
    --text:#2c3e50; --muted:#7f8c8d; --border:#dfe4e8; --ok:#27ae60; --bad:#e74c3c; --warn:#e67e22;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--light);color:var(--text)}
  .hidden{display:none !important}
  button{cursor:pointer;border:none;font-weight:bold;border-radius:3px}

  /* ---------- Login / Register (navy) ---------- */
  .authwrap{min-height:100vh;background:var(--navy);display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:20px}
  .brand{color:#fff;font-size:30px;font-weight:bold;margin:0}
  .tagline{color:#aeb6bd;font-size:14px;margin:6px 0 22px}
  .authcard{background:var(--navy2);border-radius:8px;padding:30px 32px;width:100%;max-width:410px;
    box-shadow:0 10px 34px rgba(0,0,0,.28)}
  .frow{margin-bottom:14px}
  .frow label{display:block;color:#cfd6dc;font-size:13px;margin-bottom:5px}
  .frow input,.frow select{padding:11px;border:1px solid #46617a;border-radius:5px;font-size:14px;width:100%;
    background:#fff;color:#2c3e50}
  .frow input:focus,.frow select:focus{outline:none;border-color:#5dade2}
  .otp-link{text-align:right;margin:-6px 0 4px}
  .btn-link{background:none;color:#5dade2;text-decoration:none;font-weight:600;font-size:13px;padding:2px}
  .btn-link:hover{text-decoration:underline}
  .authbtns{display:flex;gap:10px;margin-top:18px}
  .btn-green{background:var(--green);color:#fff;padding:12px;font-size:14px;flex:1}
  .btn-green:hover{background:var(--greenh)}
  .btn-blue{background:var(--blue);color:#fff;padding:12px;font-size:14px;flex:1}
  .btn-blue:hover{background:var(--blueh)}
  .authmsg{margin-top:14px;padding:10px 12px;border-radius:5px;font-size:13px;display:none;text-align:center;line-height:1.4}
  .authmsg.err{background:rgba(231,76,60,.18);color:#f5b7b1;border:1px solid rgba(231,76,60,.5);display:block}
  .authmsg.ok{background:rgba(39,174,96,.18);color:#abebc6;border:1px solid rgba(39,174,96,.5);display:block}

  /* ---------- Dashboard ---------- */
  .header{background:var(--headbar);color:#fff;display:flex;justify-content:space-between;
    align-items:center;padding:16px 26px}
  .header .h-title{font-size:22px;font-weight:bold}
  .header .h-user{color:#5dade2;font-size:15px}
  .tabs{display:flex;background:var(--light);border-bottom:1px solid #cfd6db;padding:0 16px;flex-wrap:wrap}
  .tab{padding:10px 18px;font-size:14px;color:#566573;cursor:pointer;border:1px solid transparent;border-bottom:none}
  .tab.active{background:#fff;color:var(--navy);font-weight:bold;border-color:#cfd6db;border-radius:4px 4px 0 0}
  .content{background:#fff;margin:0 16px 16px;min-height:60vh;padding:24px;border:1px solid #cfd6db;border-top:none}
  .content h2{text-align:center;color:var(--navy);margin:6px 0 24px}
  .cards{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
  .appcard{background:#fff;border:1px solid var(--border);border-radius:5px;padding:22px;width:230px;
    box-shadow:0 1px 4px rgba(0,0,0,.06);text-align:center}
  .appcard .ico{font-size:26px}
  .appcard h3{color:var(--navy);margin:8px 0 6px}
  .appcard p{color:var(--muted);font-size:13px;min-height:34px;margin:0 0 14px}
  .btn-access{background:var(--green);color:#fff;padding:8px 22px}
  .btn-access:hover{background:var(--greenh)}
  .footer{text-align:center;padding:16px}
  .btn-logout{background:var(--red);color:#fff;padding:9px 30px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid #eee}
  th{background:var(--navy);color:#fff}
  tr:nth-child(even) td{background:#f7f9fa}
  .st-ok{color:var(--ok);font-weight:bold}.st-bad{color:var(--bad);font-weight:bold}.st-warn{color:var(--warn);font-weight:bold}
  .pill{display:inline-block;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:bold}
  .pill-ok{background:#d5f5e3;color:#1e8449}.pill-bad{background:#fadbd8;color:#c0392b}
  .pill-warn{background:#fdebd0;color:#b9770e}
  .panel-narrow{max-width:760px;margin:0 auto}
  .subtitle{text-align:center;color:#7f8c8d;font-size:14px;margin:-8px 0 18px}
  .livepill{display:inline-block;background:#eafaf1;color:#1e8449;font-size:12px;font-weight:bold;
    padding:3px 12px;border-radius:20px;margin-bottom:12px}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .kpi{background:#f4f6f7;border:1px solid #e5e9ec;border-radius:6px;padding:10px 16px;text-align:center;min-width:92px}
  .kpi b{display:block;font-size:20px;color:var(--navy)}
  .kpi span{font-size:11px;color:#7f8c8d}
  .btn-block{background:#e74c3c;color:#fff;padding:5px 12px;font-size:12px}
  .btn-unblock{background:#27ae60;color:#fff;padding:5px 12px;font-size:12px}
  .badge{padding:9px 13px;border-radius:4px;font-weight:bold;display:inline-block;margin-bottom:12px}
  .badge.ok{background:#d5f5e3;color:#1e8449}.badge.bad{background:#fadbd8;color:#c0392b}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .btn-sm{padding:6px 12px;font-size:13px;color:#fff}
  .live{color:var(--green);font-size:12px;font-weight:bold}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal{background:#fff;border-radius:5px;padding:20px 24px;max-width:440px;width:92%;box-shadow:0 6px 24px rgba(0,0,0,.3)}
  .modal h3{margin:0 0 12px;color:var(--navy)}
  .modal .m-body{white-space:pre-wrap;font-size:14px;max-height:320px;overflow:auto}
  .modal label{display:block;font-size:13px;color:#566573;margin:8px 0 3px}
  .modal input,.modal select{width:100%;padding:8px;border:1px solid #ccc;border-radius:3px;font-size:14px}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="view-login" class="authwrap">
  <div class="brand">🔒 SecureAccess Pro</div>
  <div class="tagline">Zero Trust Network Access Control System</div>
  <div class="authcard">
    <div class="frow"><label>Username:</label><input id="li-user" autocomplete="username"></div>
    <div class="frow"><label>Password:</label><input id="li-pass" type="password" autocomplete="current-password"></div>
    <div class="frow"><label>2FA Code:</label><input id="li-otp" inputmode="numeric" placeholder="6-digit code"></div>
    <div class="otp-link"><button class="btn-link" onclick="requestOtp()">✉ Email me a code</button></div>
    <div class="authbtns">
      <button class="btn-green" onclick="login()">LOGIN</button>
      <button class="btn-blue" onclick="showRegister()">CREATE ACCOUNT</button>
    </div>
    <div id="li-msg" class="authmsg"></div>
  </div>
</div>

<!-- ================= REGISTER ================= -->
<div id="view-register" class="authwrap hidden">
  <div class="brand">🔒 SecureAccess Pro</div>
  <div class="tagline">Create a new account</div>
  <div class="authcard">
    <div class="frow"><label>Username:</label><input id="rg-user"></div>
    <div class="frow"><label>Email:</label><input id="rg-email" type="email"></div>
    <div class="frow"><label>Password:</label><input id="rg-pass" type="password"></div>
    <div class="frow"><label>Confirm:</label><input id="rg-conf" type="password"></div>
    <div class="frow"><label>Register as:</label>
      <select id="rg-role">
        <option value="Viewer">Viewer — read-only (Documents)</option>
        <option value="User">User — standard (HR, Patients, Documents)</option>
      </select>
    </div>
    <div class="authbtns">
      <button class="btn-green" onclick="register()">REGISTER</button>
      <button class="btn-blue" onclick="showLogin()">BACK TO LOGIN</button>
    </div>
    <div id="rg-msg" class="authmsg"></div>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="view-app" class="hidden">
  <div class="header">
    <div class="h-title">🔒 SecureAccess Pro - Dashboard</div>
    <div class="h-user" id="h-user"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="content" id="content"></div>
  <div class="footer"><button class="btn-logout" onclick="logout()">Logout</button></div>
</div>

<!-- modal host -->
<div id="modal-host"></div>

<script>
let token=null, role=null, username=null, email=null;
let monitorTimer=null;

/* ---------- helpers ---------- */
function show(v){for(const id of["login","register","app"])document.getElementById("view-"+id).classList.add("hidden");
  document.getElementById("view-"+v).classList.remove("hidden");}
function showLogin(){show("login");} function showRegister(){show("register");}
function amsg(id,t,ok){const e=document.getElementById(id);e.textContent=t;e.className="authmsg "+(ok?"ok":"err");}
function val(id){return document.getElementById(id).value.trim();}
async function api(path,opts={}){
  opts.headers=Object.assign({"Content-Type":"application/json"},opts.headers||{});
  if(token)opts.headers["Authorization"]="Bearer "+token;
  const r=await fetch(path,opts); let b={}; try{b=await r.json()}catch(e){}
  if(!r.ok)throw{status:r.status,message:b.error||b.detail||r.statusText,body:b};
  return b;
}
function stopMonitor(){if(monitorTimer){clearInterval(monitorTimer);monitorTimer=null;}}
function t19(x){return(x||"").replace("T"," ").slice(0,19);}
function scls(s){return["DENIED","FAILED","LOCKED"].includes(s)?"st-bad":(["GRANTED","SUCCESS"].includes(s)?"st-ok":"");}

/* ---------- auth ---------- */
async function requestOtp(){
  const u=val("li-user"),p=val("li-pass");
  if(!u||!p)return amsg("li-msg","Enter username and password first.",false);
  try{const d=await api("/api/request-otp",{method:"POST",body:JSON.stringify({username:u,password:p})});
    if(d.dev_code)document.getElementById("li-otp").value=d.dev_code;
    amsg("li-msg",d.message,true);}catch(e){amsg("li-msg",e.message,false);}
}
async function login(){
  try{const d=await api("/api/login",{method:"POST",body:JSON.stringify(
    {username:val("li-user"),password:val("li-pass"),tfa_code:val("li-otp")})});
    token=d.token;role=d.role;username=d.username;email=d.email;enterApp();
  }catch(e){amsg("li-msg",e.message,false);}
}
async function register(){
  try{const d=await api("/api/register",{method:"POST",body:JSON.stringify({
    username:val("rg-user"),email:val("rg-email"),password:val("rg-pass"),
    confirm_password:val("rg-conf"),role:document.getElementById("rg-role").value})});
    amsg("rg-msg",d.message+" (Role: "+d.role+")",true); setTimeout(showLogin,3500);
  }catch(e){amsg("rg-msg",e.message,false);}
}
function logout(){stopMonitor();token=role=username=null;document.getElementById("li-otp").value="";show("login");}

/* ---------- dashboard ---------- */
const APPS=[
  {ico:"👥",title:"HR Portal",desc:"Employee records\nLeave management",roles:["Admin","User"],path:"/api/protected/hr"},
  {ico:"💰",title:"Finance",desc:"Financial reports\nBudget data",roles:["Admin"],path:"/api/protected/finance"},
  {ico:"🏥",title:"Patient Records",desc:"Confidential health data",roles:["Admin","User"],path:"/api/protected/patients"},
  {ico:"📁",title:"Documents",desc:"Company files\nShared documents",roles:["Admin","User","Viewer"],path:"/api/protected/documents"},
];
function tabsFor(r){
  if(r==="Admin")return[["apps","Applications"],["access","Access Logs"],["login","Login History"],
    ["site","Site Access Log"],["alerts","Security Alerts"],["users","Users"],["patients","Patients"]];
  return[["apps","Applications"]];
}
let activeTab="apps";
function enterApp(){
  stopMonitor(); show("app");
  document.getElementById("h-user").textContent=`User: ${username} | Role: ${role}`;
  const tb=document.getElementById("tabs"); tb.innerHTML="";
  tabsFor(role).forEach(([k,label])=>{
    const d=document.createElement("div"); d.className="tab"+(k===activeTab?" active":"");
    d.textContent=label; d.onclick=()=>selectTab(k); tb.appendChild(d);
  });
  selectTab("apps");
}
function selectTab(k){
  activeTab=k; stopMonitor();
  [...document.getElementById("tabs").children].forEach(c=>c.classList.toggle("active",c.textContent===tabLabel(k)));
  if(k==="apps")renderApps();
  else if(k==="perms")renderPermissions();
  else if(k==="patients")renderPatients();
  else if(k==="users")renderUsers();
  else if(k==="alerts"){renderSecurity();monitorTimer=setInterval(renderSecurity,3000);}
  else renderLogFeed(k);
}
function tabLabel(k){return (tabsFor(role).find(t=>t[0]===k)||[,k])[1];}
function setContent(html){document.getElementById("content").innerHTML=html;}

function renderApps(){
  let h='<h2>Protected Applications</h2><div class="cards">';
  APPS.filter(a=>a.roles.includes(role)).forEach((a,i)=>{
    h+=`<div class="appcard"><div class="ico">${a.ico}</div><h3>${a.title}</h3>
      <p>${a.desc.replace(/\n/g,'<br>')}</p>
      <button class="btn-access" onclick="openApp(${i})">Access</button></div>`;
  });
  setContent(h+'</div>');
}
async function openApp(i){
  const a=APPS.filter(x=>x.roles.includes(role))[i];
  try{const d=await api(a.path);
    if(a.title==="Patient Records")modal("Access Granted — Patient Records",patientsTable(d));
    else if(a.title==="Documents")modal("Access Granted — Documents",docsTable(d));
    else modal("Access Granted — "+a.title,pretty(d.data||d));
  }catch(e){modal(e.status===403?"⛔ Access Denied":"Error",
    e.status===403?"Your role does not permit this application.\nThis attempt has been logged and the admin alerted.":e.message);}
}
function pretty(o,ind=0){const pad="  ".repeat(ind);let s="";
  if(Array.isArray(o)){o.forEach(v=>s+=pad+"• "+(typeof v==="object"?Object.entries(v).map(([k,x])=>k+"="+x).join("  "):v)+"\n");}
  else if(o&&typeof o==="object"){for(const[k,v]of Object.entries(o)){if(k.startsWith("_"))continue;
    s+= (v&&typeof v==="object")?pad+k+":\n"+pretty(v,ind+1):pad+k+": "+v+"\n";}}
  else s+=pad+o+"\n"; return s;}
function patientsTable(d){const s=d.summary||{};
  let h=`${d.classification||""}\nTotal ${s.total_patients} · Critical ${s.critical} · Serious ${s.serious} · ICU ${s.in_icu}\n\n`;
  h+="<table><tr><th>PID</th><th>Name</th><th>Age</th><th>Diagnosis</th><th>Severity</th></tr>";
  (d.patients||[]).slice(0,30).forEach(p=>h+=`<tr><td>${p.patient_id}</td><td>${p.name}</td><td>${p.age}</td><td>${p.diagnosis}</td><td>${p.severity}</td></tr>`);
  return h+"</table>";}
function docsTable(d){let h="<table><tr><th>Document</th><th>Size</th></tr>";
  (d.data.documents||[]).forEach(x=>h+=`<tr><td>${x.name}</td><td>${x.size_bytes} B</td></tr>`);return h+"</table>";}

async function renderPermissions(){
  try{const d=await api("/api/my-permissions");
    let h=`<h2>My Access Rules — Role: ${d.role}</h2>`;
    h+="<p class='subtitle'>Features marked <b>Denied</b> are outside your role. Any attempt to access them is blocked and instantly alerts the administrator.</p>";
    h+="<div class='panel-narrow'><table><tr><th>Feature / Resource</th><th style='text-align:center;width:140px'>Access</th></tr>";
    d.permissions.forEach(x=>h+=`<tr><td>${x.feature}</td><td style='text-align:center'>
      <span class="pill ${x.allowed?'pill-ok':'pill-bad'}">${x.allowed?'✓ Allowed':'✕ Denied'}</span></td></tr>`);
    setContent(h+"</table></div>");
  }catch(e){setContent("Error: "+e.message);}
}

/* ---- admin log feeds ---- */
async function renderLogFeed(k){
  const map={access:["/api/logs?limit=100","Access Logs",["Time","User","Action","Resource","Status","IP Address"]],
    login:["/api/login-history?limit=100","Login History",["Time","User","Status","Reason","IP Address"]],
    site:["/api/site-access?limit=100","Site Access Log",["Time","Method","Path","IP Address","Device / Browser"]]};
  const [url,title,cols]=map[k];
  try{const rows=await api(url);
    let h=`<h2>${title}</h2><div style="text-align:center"><span class="livepill">● live data · ${rows.length} records</span></div>`;
    h+=`<table><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr>`;
    rows.forEach(r=>{
      if(k==="access")h+=`<tr><td>${t19(r.timestamp)}</td><td>${r.username||""}</td><td>${r.action||""}</td><td>${r.resource||""}</td><td class="${scls(r.status)}">${r.status||""}</td><td>${r.ip_address||""}</td></tr>`;
      else if(k==="login")h+=`<tr><td>${t19(r.login_time)}</td><td>${r.username||""}</td><td class="${scls(r.status)}">${r.status||""}</td><td>${r.failure_reason||""}</td><td>${r.ip_address||""}</td></tr>`;
      else h+=`<tr><td>${t19(r.access_time)}</td><td>${r.method||""}</td><td>${r.page_accessed||""}</td><td>${r.ip_address||""}</td><td>${(r.user_agent||"").slice(0,42)}</td></tr>`;
    });
    if(!rows.length)h+="<tr><td colspan='6' style='text-align:center;color:#7f8c8d'>No records yet.</td></tr>";
    setContent(h+"</table>");
  }catch(e){setContent("Error: "+e.message);}
}

async function renderSecurity(){
  try{const [m,al,au]=await Promise.all([api("/api/metrics"),api("/api/alerts"),api("/api/audit/verify")]);
    let h=`<h2>Security Alerts &amp; Monitoring</h2><div style="text-align:center"><span class="livepill">● auto-refreshing every 3s</span></div>`;
    h+=`<div style="text-align:center"><div class="badge ${au.intact?"ok":"bad"}">🔒 Audit integrity: ${au.intact?"VERIFIED — "+au.total+" entries, no tampering":"⚠ TAMPERING DETECTED at entry #"+au.broken_at}</div></div>`;
    h+=`<div class="kpis" style="justify-content:center">
      <div class="kpi"><b>${m.total_users}</b><span>Users</span></div>
      <div class="kpi"><b>${m.total_logins}</b><span>Logins</span></div>
      <div class="kpi" style="color:#e67e22"><b>${m.failed_logins}</b><span>Failed</span></div>
      <div class="kpi" style="color:#c0392b"><b>${m.denied_access}</b><span>Denied</span></div>
      <div class="kpi" style="color:#c0392b"><b>${al.count}</b><span>Alerts</span></div>
      <div class="kpi" style="color:#27ae60"><b>${m.granted_access}</b><span>Granted</span></div></div>`;
    h+=`<table><tr><th>Severity</th><th>Type</th><th>Subject</th><th>Detail</th><th style="width:110px">Action</th></tr>`;
    al.alerts.forEach(a=>{
      const canBlock=a.subject && a.subject!=="unknown";
      h+=`<tr><td><span class="pill ${a.severity==='HIGH'?'pill-bad':'pill-warn'}">${a.severity}</span></td>
        <td>${a.type}</td><td>${a.subject}</td><td>${a.detail}</td>
        <td>${canBlock?`<button class="btn-block" onclick="blockUser('${a.subject}')">🚫 Block</button>`:""}</td></tr>`;
    });
    if(!al.alerts.length)h+="<tr><td colspan='5' style='text-align:center' class='st-ok'>✓ No active threats detected</td></tr>";
    setContent(h+"</table>");
  }catch(e){setContent("Error: "+e.message);}
}

/* ---- Users management (admin) ---- */
async function renderUsers(){
  try{const users=await api("/api/users");
    let h=`<h2>User Management</h2><p class="subtitle">Block a user to instantly revoke their access after suspicious activity.</p>`;
    h+=`<div class="panel-narrow"><table><tr><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th style="width:120px">Action</th></tr>`;
    users.forEach(u=>{
      const status=u.blocked?`<span class="pill pill-bad">Blocked</span>`
        :(u.locked?`<span class="pill pill-warn">Locked</span>`:`<span class="pill pill-ok">Active</span>`);
      let action="";
      if(u.role!=="Admin") action=u.blocked
        ?`<button class="btn-unblock" onclick="unblockUser('${u.username}')">Unblock</button>`
        :`<button class="btn-block" onclick="blockUser('${u.username}')">🚫 Block</button>`;
      else action="<span style='color:#7f8c8d;font-size:12px'>—</span>";
      h+=`<tr><td>${u.username}</td><td>${u.email||""}</td><td>${u.role}</td><td>${status}</td><td>${action}</td></tr>`;
    });
    setContent(h+"</table></div>");
  }catch(e){setContent("Error: "+e.message);}
}
async function blockUser(username){
  if(!confirm("Block '"+username+"'? They will be denied all access immediately."))return;
  try{await api("/api/users/"+encodeURIComponent(username)+"/block",{method:"POST"});
    alert("'"+username+"' blocked. Their access is now revoked.");
    if(activeTab==="users")renderUsers(); else if(activeTab==="alerts")renderSecurity();
  }catch(e){alert(e.message);}
}
async function unblockUser(username){
  try{await api("/api/users/"+encodeURIComponent(username)+"/unblock",{method:"POST"});renderUsers();}
  catch(e){alert(e.message);}
}

/* ---- patients CRUD (admin) ---- */
async function renderPatients(){
  try{const d=await api("/api/protected/patients");
    let h=`<h2>Patient Records (${d.summary.total_patients})</h2>`;
    h+=`<div class="toolbar"><button class="btn-sm" style="background:#27ae60" onclick="addPatient()">+ Add Patient</button></div>`;
    h+="<table><tr><th>PID</th><th>Name</th><th>Age</th><th>Diagnosis</th><th>Severity</th><th>Dept</th><th></th></tr>";
    (d.patients||[]).forEach(p=>h+=`<tr><td>${p.patient_id}</td><td>${p.name}</td><td>${p.age}</td><td>${p.diagnosis}</td>
      <td class="${p.severity==='Critical'?'st-bad':(p.severity==='Serious'?'st-warn':'')}">${p.severity}</td><td>${p.department}</td>
      <td><button class="btn-sm" style="background:#e74c3c" onclick="delPatient('${p.patient_id}')">Delete</button></td></tr>`);
    setContent(h+"</table>");
  }catch(e){setContent("Error: "+e.message);}
}
async function addPatient(){
  const name=prompt("Patient name:"); if(!name)return;
  const diagnosis=prompt("Diagnosis:","Observation")||"";
  const severity=prompt("Severity (Critical/Serious/Moderate/Stable):","Stable")||"Stable";
  try{await api("/api/protected/patients",{method:"POST",body:JSON.stringify({name,diagnosis,severity,department:"General",status:"Admitted"})});renderPatients();}
  catch(e){alert(e.message);}
}
async function delPatient(pid){if(!confirm("Delete "+pid+"?"))return;
  try{await api("/api/protected/patients/"+pid,{method:"DELETE"});renderPatients();}catch(e){alert(e.message);}}

/* ---- modal ---- */
function modal(title,body){
  document.getElementById("modal-host").innerHTML=
    `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
      <h3>${title}</h3><div class="m-body">${/[<]/.test(body)?body:escapeHtml(body)}</div>
      <div style="text-align:right;margin-top:14px"><button class="btn-blue" onclick="closeModal()">OK</button></div>
    </div></div>`;
}
function closeModal(){document.getElementById("modal-host").innerHTML="";}
function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!document.getElementById("view-login").classList.contains("hidden"))login();});
</script>
</body>
