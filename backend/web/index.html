<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureAccess Pro - Zero Trust Network Access</title>
<style>
  :root{
    --navy:#2c3e50; --navy2:#34495e; --headbar:#2c3e50; --light:#ecf0f1; --white:#fff;
    --green:#27ae60; --greenh:#219150; --blue:#3498db; --blueh:#2b83bf; --red:#e74c3c;
    --text:#2c3e50; --muted:#7f8c8d; --border:#dfe4e8; --ok:#27ae60; --bad:#e74c3c; --warn:#e67e22;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--light);color:var(--text)}
  .hidden{display:none !important}
  button{cursor:pointer;border:none;font-weight:bold;border-radius:3px}

  /* ---------- Login / Register (navy) ---------- */
  .authwrap{min-height:100vh;background:var(--navy);display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:20px}
  .brand{color:#fff;font-size:30px;font-weight:bold;margin:0}
  .tagline{color:#aeb6bd;font-size:14px;margin:6px 0 22px}
  .authcard{background:var(--navy2);border-radius:8px;padding:30px 32px;width:100%;max-width:410px;
    box-shadow:0 10px 34px rgba(0,0,0,.28)}
  .frow{margin-bottom:14px}
  .frow label{display:block;color:#cfd6dc;font-size:13px;margin-bottom:5px}
  .frow input,.frow select{padding:11px;border:1px solid #46617a;border-radius:5px;font-size:14px;width:100%;
    background:#fff;color:#2c3e50}
  .frow input:focus,.frow select:focus{outline:none;border-color:#5dade2}
  .otp-link{text-align:right;margin:-6px 0 4px}
  .btn-link{background:none;color:#5dade2;text-decoration:none;font-weight:600;font-size:13px;padding:2px}
  .btn-link:hover{text-decoration:underline}
  .authbtns{display:flex;gap:10px;margin-top:18px}
  .btn-green{background:var(--green);color:#fff;padding:12px;font-size:14px;flex:1}
  .btn-green:hover{background:var(--greenh)}
  .btn-blue{background:var(--blue);color:#fff;padding:12px;font-size:14px;flex:1}
  .btn-blue:hover{background:var(--blueh)}
  .authmsg{margin-top:14px;padding:10px 12px;border-radius:5px;font-size:13px;display:none;text-align:center;line-height:1.4}
  .authmsg.err{background:rgba(231,76,60,.18);color:#f5b7b1;border:1px solid rgba(231,76,60,.5);display:block}
  .authmsg.ok{background:rgba(39,174,96,.18);color:#abebc6;border:1px solid rgba(39,174,96,.5);display:block}

  /* ---------- Dashboard ---------- */
  .header{background:var(--headbar);color:#fff;display:flex;justify-content:space-between;
    align-items:center;padding:16px 26px}
  .header .h-title{font-size:22px;font-weight:bold}
  .header .h-right{text-align:right}
  .header .h-user{color:#5dade2;font-size:15px}
  .header .h-clock{color:#aeb6bd;font-size:12.5px;margin-bottom:2px}
  .header .h-clock b{color:#eafaf1;font-weight:600}
  .tabs{display:flex;background:var(--light);border-bottom:1px solid #cfd6db;padding:0 16px;flex-wrap:wrap}
  .tab{padding:10px 18px;font-size:14px;color:#566573;cursor:pointer;border:1px solid transparent;border-bottom:none}
  .tab.active{background:#fff;color:var(--navy);font-weight:bold;border-color:#cfd6db;border-radius:4px 4px 0 0}
  .content{background:#fff;margin:0 16px 16px;min-height:60vh;padding:24px;border:1px solid #cfd6db;border-top:none}
  .content h2{text-align:center;color:var(--navy);margin:6px 0 24px}
  .cards{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
  .appcard{background:#fff;border:1px solid var(--border);border-radius:5px;padding:22px;width:230px;
    box-shadow:0 1px 4px rgba(0,0,0,.06);text-align:center}
  .appcard .ico{font-size:26px}
  .appcard h3{color:var(--navy);margin:8px 0 6px}
  .appcard p{color:var(--muted);font-size:13px;min-height:34px;margin:0 0 14px}
  .btn-access{background:var(--green);color:#fff;padding:8px 22px}
  .btn-access:hover{background:var(--greenh)}
  .footer{text-align:center;padding:16px}
  .btn-logout{background:var(--red);color:#fff;padding:9px 30px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid #eee}
  th{background:var(--navy);color:#fff}
  tr:nth-child(even) td{background:#f7f9fa}
  .st-ok{color:var(--ok);font-weight:bold}.st-bad{color:var(--bad);font-weight:bold}.st-warn{color:var(--warn);font-weight:bold}
  .pill{display:inline-block;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:bold}
  .pill-ok{background:#d5f5e3;color:#1e8449}.pill-bad{background:#fadbd8;color:#c0392b}
  .pill-warn{background:#fdebd0;color:#b9770e}
  .panel-narrow{max-width:760px;margin:0 auto}
  .subtitle{text-align:center;color:#7f8c8d;font-size:14px;margin:-8px 0 18px}
  .livepill{display:inline-block;background:#eafaf1;color:#1e8449;font-size:12px;font-weight:bold;
    padding:3px 12px;border-radius:20px;margin-bottom:12px}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .kpi{background:#f4f6f7;border:1px solid #e5e9ec;border-radius:6px;padding:10px 16px;text-align:center;min-width:92px}
  .kpi b{display:block;font-size:20px;color:var(--navy)}
  .kpi span{font-size:11px;color:#7f8c8d}
  .sech{color:var(--navy);font-size:16px;margin:20px 0 8px;border-bottom:2px solid #eef2f4;padding-bottom:5px}
  .muted{color:#95a5a6;font-weight:normal;font-size:12px}
  /* ---- Risk & Policy premium styling ---- */
  .rk-title{text-align:center;margin:2px 0 2px}
  .rk-pipe{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:10px 0 6px}
  .rk-step{background:#eef3f7;color:#40566a;border:1px solid #dde5ea;border-radius:20px;padding:5px 13px;font-size:12px;font-weight:600}
  .rk-step.key{background:var(--navy);color:#fff;border-color:var(--navy)}
  .rk-arrow{color:#b7c2ca;font-weight:bold;font-size:13px}
  .rk-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:16px 0 6px}
  @media(max-width:920px){.rk-kpis{grid-template-columns:repeat(3,1fr)}}
  .rk-card{background:#fff;border:1px solid #e6ebee;border-radius:11px;padding:15px 10px 13px;text-align:center;
    box-shadow:0 1px 4px rgba(20,40,60,.06);border-top:3px solid var(--accent,#3498db)}
  .rk-card .ic{font-size:19px;line-height:1}
  .rk-card .num{font-size:27px;font-weight:800;color:var(--navy);line-height:1.1;margin-top:3px}
  .rk-card .lbl{font-size:10.5px;color:#8a97a0;text-transform:uppercase;letter-spacing:.5px;margin-top:3px;font-weight:600}
  .rk-sec{display:flex;align-items:center;gap:8px;color:var(--navy);font-size:15px;font-weight:700;
    margin:24px 0 11px;padding-bottom:7px;border-bottom:2px solid #eef2f4}
  .rk-sec .tag{font-weight:400;font-size:12px;color:#9aa7af;margin-left:auto}
  .rk-meter{display:inline-flex;align-items:center;gap:7px;vertical-align:middle}
  .rk-bar{width:54px;height:7px;border-radius:4px;background:#edf1f3;overflow:hidden;position:relative}
  .rk-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
  .rk-score{font-size:12px;color:#7f8c8d;font-weight:700;min-width:22px}
  .rk-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:700}
  .rk-none{background:#eceff1;color:#607d8b} .rk-low{background:#e9f8ef;color:#1e8449}
  .rk-med{background:#fef5e7;color:#c87f0a} .rk-high{background:#fdece3;color:#cf5411} .rk-crit{background:#fdeaea;color:#b01919}
  table.rk{box-shadow:0 1px 4px rgba(20,40,60,.06);border-radius:9px;overflow:hidden}
  .rk-mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:#8a97a0}
  .rk-legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:10px 0 2px;font-size:11px;color:#7f8c8d}
  .rk-legend b{font-weight:600;color:#7f8c8d;margin-right:2px}
  .rk-legend span{padding:3px 9px;border-radius:5px;font-weight:700}
  .upbox{display:flex;gap:12px;align-items:center;background:#f8fafb;border:1.5px dashed #cbd5db;
    border-radius:8px;padding:18px 16px;margin-bottom:6px}
  .upbox input[type=file]{flex:1;font-size:13px}
  .btn-block{background:#e74c3c;color:#fff;padding:5px 12px;font-size:12px}
  .btn-unblock{background:#27ae60;color:#fff;padding:5px 12px;font-size:12px}
  .badge{padding:9px 13px;border-radius:4px;font-weight:bold;display:inline-block;margin-bottom:12px}
  .badge.ok{background:#d5f5e3;color:#1e8449}.badge.bad{background:#fadbd8;color:#c0392b}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .btn-sm{padding:6px 12px;font-size:13px;color:#fff}
  .live{color:var(--green);font-size:12px;font-weight:bold}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal{background:#fff;border-radius:5px;padding:20px 24px;max-width:440px;width:92%;box-shadow:0 6px 24px rgba(0,0,0,.3)}
  .modal h3{margin:0 0 12px;color:var(--navy)}
  .modal .m-body{white-space:pre-wrap;font-size:14px;max-height:320px;overflow:auto}
  .modal label{display:block;font-size:13px;color:#566573;margin:8px 0 3px}
  .modal input,.modal select{width:100%;padding:8px;border:1px solid #ccc;border-radius:3px;font-size:14px}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="view-login" class="authwrap">
  <div class="brand">SecureAccess Pro</div>
  <div class="tagline">Zero Trust Network Access Control System</div>
  <div class="authcard">
    <div class="frow"><label>Username:</label><input id="li-user" autocomplete="username"></div>
    <div class="frow"><label>Password:</label><input id="li-pass" type="password" autocomplete="current-password"></div>
    <div class="frow"><label>2FA Code:</label><input id="li-otp" inputmode="numeric" placeholder="6-digit code"></div>
    <div class="otp-link"><button class="btn-link" onclick="requestOtp()">Send OTP</button></div>
    <div class="authbtns">
      <button class="btn-green" onclick="login()">LOGIN</button>
      <button class="btn-blue" onclick="showRegister()">CREATE ACCOUNT</button>
    </div>
    <div style="text-align:center;margin-top:12px"><button class="btn-link" onclick="showForgot()">Forgot password?</button></div>
    <div id="li-msg" class="authmsg"></div>
  </div>
</div>

<!-- ================= FORGOT PASSWORD ================= -->
<div id="view-forgot" class="authwrap hidden">
  <div class="brand">SecureAccess Pro</div>
  <div class="tagline">Reset your password</div>
  <div class="authcard">
    <div class="frow"><label>Username or Email:</label><input id="fp-user"></div>
    <div class="otp-link"><button class="btn-link" onclick="sendReset()">Send reset code</button></div>
    <div class="frow"><label>Reset Code:</label><input id="fp-code" inputmode="numeric" placeholder="6-digit code"></div>
    <div class="frow"><label>New Password:</label><input id="fp-pass" type="password"></div>
    <div class="frow"><label>Confirm:</label><input id="fp-conf" type="password"></div>
    <div class="authbtns">
      <button class="btn-green" onclick="doReset()">RESET PASSWORD</button>
      <button class="btn-blue" onclick="showLogin()">BACK TO LOGIN</button>
    </div>
    <div id="fp-msg" class="authmsg"></div>
  </div>
</div>

<!-- ================= REGISTER ================= -->
<div id="view-register" class="authwrap hidden">
  <div class="brand">SecureAccess Pro</div>
  <div class="tagline">Create a new account</div>
  <div class="authcard">
    <div class="frow"><label>Username:</label><input id="rg-user"></div>
    <div class="frow"><label>Email:</label><input id="rg-email" type="email"></div>
    <div class="frow"><label>Password:</label><input id="rg-pass" type="password"></div>
    <div class="frow"><label>Confirm:</label><input id="rg-conf" type="password"></div>
    <div class="frow"><label>Register as:</label>
      <select id="rg-role">
        <option value="Viewer">Viewer — read-only (Documents)</option>
        <option value="User">User — standard (HR, Patients, Documents)</option>
      </select>
    </div>
    <div class="authbtns">
      <button class="btn-green" onclick="register()">REGISTER</button>
      <button class="btn-blue" onclick="showLogin()">BACK TO LOGIN</button>
    </div>
    <div id="rg-msg" class="authmsg"></div>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="view-app" class="hidden">
  <div class="header">
    <div class="h-title">SecureAccess Pro - Dashboard</div>
    <div class="h-right">
      <div class="h-clock" id="h-clock"></div>
      <div class="h-user" id="h-user"></div>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="content" id="content"></div>
  <div class="footer"><button class="btn-logout" onclick="logout()">Logout</button></div>
</div>

<!-- modal host -->
<div id="modal-host"></div>

<script>
let token=null, role=null, username=null, email=null, lastRisk=null;
let monitorTimer=null;

/* Phase 2: a stable per-browser device id (never PII) for device-trust. */
function deviceId(){
  let d=localStorage.getItem("sap_device_id");
  if(!d){d="dev-"+Math.random().toString(36).slice(2)+Date.now().toString(36);
    localStorage.setItem("sap_device_id",d);}
  return d;
}

/* ---------- helpers ---------- */
function show(v){for(const id of["login","register","forgot","app"])document.getElementById("view-"+id).classList.add("hidden");
  document.getElementById("view-"+v).classList.remove("hidden");}
function showLogin(){show("login");} function showRegister(){show("register");} function showForgot(){show("forgot");}
function amsg(id,t,ok){const e=document.getElementById(id);e.textContent=t;e.className="authmsg "+(ok?"ok":"err");}
function val(id){return document.getElementById(id).value.trim();}
async function api(path,opts={}){
  opts.headers=Object.assign({"Content-Type":"application/json","X-Device-Id":deviceId()},opts.headers||{});
  if(token)opts.headers["Authorization"]="Bearer "+token;
  const r=await fetch(path,opts); let b={}; try{b=await r.json()}catch(e){}
  if(!r.ok){
    // Phase 2: a revoked session ends the session immediately (401 blocklist or
    // 403 from continuous verification both carry session_revoked).
    if(b.session_revoked){handleRevoked(b.error||"Session revoked.");}
    throw{status:r.status,message:b.error||b.detail||r.statusText,body:b};
  }
  return b;
}
function handleRevoked(msg){
  stopMonitor(); token=role=username=null;
  show("login"); amsg("li-msg",msg+" Please sign in again.",false);
}
function stopMonitor(){if(monitorTimer){clearInterval(monitorTimer);monitorTimer=null;}}
/* Server timestamps are UTC; show them in the viewer's local time (AM/PM). */
function t19(x){
  if(!x)return "";
  let s=x; if(!/[zZ]|[+-]\d\d:?\d\d$/.test(s))s+="Z";  // mark as UTC if unmarked
  const d=new Date(s);
  if(isNaN(d))return (x||"").replace("T"," ").slice(0,19);
  return d.toLocaleString(undefined,{year:"numeric",month:"2-digit",day:"2-digit",
    hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true});
}
/* Auto-detect the current user's operating system from the browser. */
function detectOS(){
  const ua=navigator.userAgent||"";
  const d=navigator.userAgentData;
  if(d&&d.platform)return d.platform;             // most reliable when available
  if(/Windows/i.test(ua))return "Windows";
  if(/Android/i.test(ua))return "Android";
  if(/iPhone|iPad|iPod/i.test(ua))return "iOS";
  if(/CrOS/i.test(ua))return "Chrome OS";
  if(/Mac OS X|Macintosh/i.test(ua))return "macOS";
  if(/Linux/i.test(ua))return "Linux";
  return "Unknown OS";
}
/* Real-time local clock in the header (updates every second). */
let clockTimer=null;
function startClock(){
  const el=document.getElementById("h-clock");
  function tick(){
    if(!el)return;
    const t=new Date().toLocaleString(undefined,{weekday:"short",day:"2-digit",month:"short",
      hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true});
    el.innerHTML=`OS: <b>${detectOS()}</b> &middot; <b>${t}</b>`;
  }
  tick(); if(clockTimer)clearInterval(clockTimer); clockTimer=setInterval(tick,1000);
}
function scls(s){return["DENIED","FAILED","LOCKED"].includes(s)?"st-bad":(["GRANTED","SUCCESS"].includes(s)?"st-ok":"");}

/* ---------- auth ---------- */
async function requestOtp(){
  const u=val("li-user"),p=val("li-pass");
  if(!u||!p)return amsg("li-msg","Enter username and password first.",false);
  try{const d=await api("/api/request-otp",{method:"POST",body:JSON.stringify({username:u,password:p,device_id:deviceId()})});
    if(d.dev_code)document.getElementById("li-otp").value=d.dev_code;
    amsg("li-msg",d.message,true);}catch(e){amsg("li-msg",e.message,false);}
}
async function login(){
  try{const d=await api("/api/login",{method:"POST",body:JSON.stringify(
    {username:val("li-user"),password:val("li-pass"),tfa_code:val("li-otp"),device_id:deviceId()})});
    token=d.token;role=d.role;username=d.username;email=d.email;lastRisk=d.risk||null;enterApp();
  }catch(e){amsg("li-msg",e.message,false);}
}
async function register(){
  try{const d=await api("/api/register",{method:"POST",body:JSON.stringify({
    username:val("rg-user"),email:val("rg-email"),password:val("rg-pass"),
    confirm_password:val("rg-conf"),role:document.getElementById("rg-role").value})});
    amsg("rg-msg",d.message+" (Role: "+d.role+")",true); setTimeout(showLogin,3500);
  }catch(e){amsg("rg-msg",e.message,false);}
}
async function logout(){
  try{await api("/api/logout",{method:"POST"});}catch(e){}  // revoke the session server-side
  stopMonitor();if(clockTimer)clearInterval(clockTimer);
  token=role=username=null;document.getElementById("li-otp").value="";show("login");
}

async function sendReset(){
  const u=val("fp-user");
  if(!u)return amsg("fp-msg","Enter your username or email first.",false);
  try{const d=await api("/api/forgot-password",{method:"POST",body:JSON.stringify({username:u})});
    if(d.dev_code)document.getElementById("fp-code").value=d.dev_code;
    amsg("fp-msg",d.message,true);}catch(e){amsg("fp-msg",e.message,false);}
}
async function doReset(){
  try{const d=await api("/api/reset-password",{method:"POST",body:JSON.stringify({
    username:val("fp-user"),code:val("fp-code"),password:val("fp-pass"),confirm_password:val("fp-conf")})});
    amsg("fp-msg",d.message,true); setTimeout(showLogin,2500);
  }catch(e){amsg("fp-msg",e.message,false);}
}

/* ---------- dashboard ---------- */
const APPS=[
  {title:"HR Portal",desc:"Employee records\nLeave management",roles:["Admin","User"],path:"/api/protected/hr"},
  {title:"Finance",desc:"Financial reports\nBudget data",roles:["Admin"],path:"/api/protected/finance"},
  {title:"Patient Records",desc:"Confidential health data",roles:["Admin","User"],path:"/api/protected/patients"},
  {title:"Documents",desc:"Company files\nShared documents",roles:["Admin","User","Viewer"],path:"/api/protected/documents"},
];
function tabsFor(r){
  if(r==="Admin")return[["apps","Applications"],["risk","Risk & Policy"],["filesec","File Security"],["access","Access Logs"],
    ["login","Login History"],["site","Site Access Log"],["alerts","Security Alerts"],["users","Users"],["patients","Patients"]];
  if(r==="User")return[["apps","Applications"],["files","Files"]];
  return[["apps","Applications"]];
}
let activeTab="apps";
function enterApp(){
  stopMonitor(); show("app"); startClock();
  document.getElementById("h-user").textContent=`User: ${username} | Role: ${role}`;
  const tb=document.getElementById("tabs"); tb.innerHTML="";
  tabsFor(role).forEach(([k,label])=>{
    const d=document.createElement("div"); d.className="tab"+(k===activeTab?" active":"");
    d.textContent=label; d.onclick=()=>selectTab(k); tb.appendChild(d);
  });
  selectTab("apps");
}
function selectTab(k){
  activeTab=k; stopMonitor();
  [...document.getElementById("tabs").children].forEach(c=>c.classList.toggle("active",c.textContent===tabLabel(k)));
  if(k==="apps")renderApps();
  else if(k==="perms")renderPermissions();
  else if(k==="patients")renderPatients();
  else if(k==="users")renderUsers();
  else if(k==="risk"){renderRisk();monitorTimer=setInterval(renderRisk,3000);}
  else if(k==="files")renderFiles();
  else if(k==="filesec"){renderFileSecurity();monitorTimer=setInterval(renderFileSecurity,3000);}
  else if(k==="alerts"){renderSecurity();monitorTimer=setInterval(renderSecurity,3000);}
  else renderLogFeed(k);
}
function tabLabel(k){return (tabsFor(role).find(t=>t[0]===k)||[,k])[1];}
function setContent(html){document.getElementById("content").innerHTML=html;}

function renderApps(){
  let h='<h2>Protected Applications</h2>';
  if(lastRisk){
    const lv=lastRisk.level, c=(lv==="High"||lv==="Critical")?"pill-bad":(lv==="Medium"?"pill-warn":"pill-ok");
    const dev=lastRisk.known_device?"Trusted device":"New device";
    const cv=(lastRisk.cvss!=null?lastRisk.cvss:0).toFixed(1);
    h+=`<div style="text-align:center;margin:-6px 0 16px"><span class="pill ${c}">${dev} &middot; Login risk: ${lv} (CVSS ${cv})</span></div>`;
  }
  h+='<div class="cards">';
  APPS.filter(a=>a.roles.includes(role)).forEach((a,i)=>{
    h+=`<div class="appcard"><h3>${a.title}</h3>
      <p>${a.desc.replace(/\n/g,'<br>')}</p>
      <button class="btn-access" onclick="openApp(${i})">Access</button></div>`;
  });
  setContent(h+'</div>');
}
async function openApp(i){

function pretty(o,ind=0){const pad="  ".repeat(ind);let s="";
  if(Array.isArray(o)){o.forEach(v=>s+=pad+"• "+(typeof v==="object"?Object.entries(v).map(([k,x])=>k+"="+x).join("  "):v)+"\n");}
  else if(o&&typeof o==="object"){for(const[k,v]of Object.entries(o)){if(k.startsWith("_"))continue;
    s+= (v&&typeof v==="object")?pad+k+":\n"+pretty(v,ind+1):pad+k+": "+v+"\n";}}
  else s+=pad+o+"\n"; return s;}
function patientsTable(d){const s=d.summary||{};

const BAND_CLASS={None:"rk-none",Low:"rk-low",Medium:"rk-med",High:"rk-high",Critical:"rk-crit"};
const BAND_COLOR={None:"#90a4ae",Low:"#27ae60",Medium:"#e67e22",High:"#cf5411",Critical:"#c0392b"};
function riskBadge(l){return `<span class="rk-badge ${BAND_CLASS[l]||'rk-none'}">${l}</span>`;}
function riskMeter(level,cvss){const w=Math.max(4,Math.min(100,(cvss||0)*10));
  return `<span class="rk-meter"><span class="rk-bar"><i style="width:${w}%;background:${BAND_COLOR[level]||'#90a4ae'}"></i></span><span class="rk-score">${(cvss||0).toFixed(1)}</span></span>`;}
function decisionBadge(d){
  if(d==="REVOKE")return `<span class="rk-badge rk-crit">REVOKE</span>`;
  if(d==="STEP_UP")return `<span class="rk-badge rk-med">STEP-UP</span>`;
  return `<span class="rk-badge rk-low">ALLOW</span>`;}
function cvssLegend(){
  const items=[["None","0.0","rk-none"],["Low","0.1–3.9","rk-low"],["Medium","4.0–6.9","rk-med"],
    ["High","7.0–8.9","rk-high"],["Critical","9.0–10.0","rk-crit"]];
  return `<div class="rk-legend"><b>CVSS severity rating</b>`+
    items.map(i=>`<span class="${i[2]}">${i[0]} ${i[1]}</span>`).join("")+`</div>`;
}
function pipeStrip(){
  const steps=[["Identity",0],["MFA",0],["Device",1],["Context",0],["Risk Score",1],
    ["Policy Engine",1],["Decision",0],["Continuous Verify",1],["Auto Response",1]];
  return `<div class="rk-pipe">`+steps.map((s,i)=>
    `<span class="rk-step${s[1]?" key":""}">${s[0]}</span>`+
    (i<steps.length-1?`<span class="rk-arrow">&rarr;</span>`:"")).join("")+`</div>`;
}

/* ---- Secure File Upload + Malware Detection ---- */
function scanBadge(s){
  const m={CLEAN:["rk-low","Clean"],SUSPICIOUS:["rk-med","Suspicious"],MALICIOUS:["rk-crit","Malicious"],
    SCAN_ERROR:["rk-med","Scan error"],PENDING_SCAN:["rk-none","Pending"]};
  const x=m[s]||["rk-none",s]; return `<span class="rk-badge ${x[0]}">${x[1]}</span>`;}
function reviewBadge(s){
  const m={APPROVED:["rk-low","Approved"],QUARANTINED:["rk-crit","Quarantined"],REJECTED:["rk-med","Rejected"],PENDING:["rk-none","Pending"]};
  const x=m[s]||["rk-none",s]; return `<span class="rk-badge ${x[0]}">${x[1]}</span>`;}
function fbytes(n){n=n||0;return n<1024?n+" B":(n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB");}
function fmsg(t,ok){const e=document.getElementById("fu-msg");if(e){e.textContent=t;e.className="authmsg "+(ok?"ok":"err");}}

async function uploadFile(){
  const inp=document.getElementById("fu-input");
  if(!inp||!inp.files.length)return fmsg("Please choose a file first.",false);
  const fd=new FormData(); fd.append("file",inp.files[0]);
  fmsg("Uploading and running the security scan…",true);
  try{
    const r=await fetch("/api/files/upload",{method:"POST",
      headers:{"Authorization":"Bearer "+token,"X-Device-Id":deviceId()},body:fd});
    const b=await r.json().catch(()=>({}));
    if(!r.ok){ if(b.session_revoked)handleRevoked(b.error||"Session revoked."); return fmsg(b.error||"Upload failed.",false); }
    fmsg(b.message,!b.blocked); inp.value=""; loadMyFiles();
  }catch(e){fmsg("Upload failed: "+e.message,false);}
}

  let h=`<h2>Secure File Upload</h2>`;

async function downloadFile(id){
  try{
    const r=await fetch("/api/files/"+id+"/download",{headers:{"Authorization":"Bearer "+token,"X-Device-Id":deviceId()}});
    if(!r.ok){const b=await r.json().catch(()=>({}));if(b.session_revoked)handleRevoked(b.error||"Session revoked.");return alert(b.error||"Download failed.");}
    const blob=await r.blob(); const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=""; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){alert("Download failed: "+e.message);}
}

      `<div class="rk-card" style="--accent:${c[2]}"><div class="num">${c[0]}</div><div class="lbl">${c[1]}</div></div>`).join("")+`</div>`;
    h+=`<div class="rk-sec">Recent Uploads &amp; Detections <span class="tag">SHA-256 · detection · review</span></div>`;
    h+=`<table class="rk"><tr><th>Time</th><th>User</th><th>File</th><th>SHA-256</th><th>Scan</th><th>Detection</th><th>Status</th><th style="width:200px">Review</th></tr>`;
    files.forEach(f=>{
      let act="<span class='muted'>—</span>";
      if(f.review_status==="QUARANTINED"||f.review_status==="PENDING"){
        const approve=(f.scan_status==="MALICIOUS"||f.scan_status==="SCAN_ERROR")?"":
          `<button class="btn-unblock" onclick="reviewFile(${f.id},'approve')">Approve</button> `;
        act=`${approve}<button class="btn-block" onclick="reviewFile(${f.id},'reject')">Reject</button>`;
      }
      h+=`<tr><td>${t19(f.upload_time)}</td><td><b>${f.username||""}</b></td><td>${f.original_filename}</td>
        <td class="rk-mono">${(f.file_hash||"").slice(0,12)}…</td><td>${scanBadge(f.scan_status)}</td>
        <td class="muted">${f.detection_name||"—"}</td><td>${reviewBadge(f.review_status)}</td><td>${act}</td></tr>`;
    });
    if(!files.length)h+="<tr><td colspan='8' style='text-align:center' class='muted'>No uploads yet.</td></tr>";
    setContent(h+"</table>");
  }catch(e){setContent("Error: "+e.message);}
}
async function reviewFile(id,decision){
  try{await api("/api/admin/files/"+id+"/review",{method:"POST",body:JSON.stringify({decision})});renderFileSecurity();}
  catch(e){alert(e.message);}
}

/* ---- modal ---- */
function modal(title,body){
  document.getElementById("modal-host").innerHTML=
    `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
      <h3>${title}</h3><div class="m-body">${/[<]/.test(body)?body:escapeHtml(body)}</div>
      <div style="text-align:right;margin-top:14px"><button class="btn-blue" onclick="closeModal()">OK</button></div>
    </div></div>`;
}
function closeModal(){document.getElementById("modal-host").innerHTML="";}
function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!document.getElementById("view-login").classList.contains("hidden"))login();});
</script>
